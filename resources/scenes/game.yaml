scene_name: Game
game_objects:
  - uuid: 1
    TransformComponent:
      translation: [ 100, 200 ]
      rotation: 0
      scale: [ 1, 1 ]
    SpriteComponent:
      offset: { "x": 0, "y": 0 }
      texture: "space_craft.png"
      max_size: { "width": 100, "height": 100 }
    ScriptComponent:
      file_name: "player.lua"
  - uuid: 2
    TransformComponent:
      translation: [ 100, 400 ]
      rotation: 0
      scale: [ 0.5, 0.5 ]
    SpriteComponent:
      offset: { "x": 0, "y": 0 }
      texture: "laser.png"
      max_size: { "width": 50, "height": 50 }
    ScriptComponent:
      file_name: "laser.lua"
  - uuid: 3
    TransformComponent:
      translation: [ 0, 0 ]
      rotation: 0
      scale: [ 1, 1 ]
    NetworkComponent:
      create_function: "CreateServer"
      on_client_connect_function_name: "OnServerClientConnected"
      on_client_disconnect_function_name: "OnServerClientDisconnected"
    ScriptComponent:
      file_name: "server.lua"